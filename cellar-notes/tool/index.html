 t.due.forEach(function(s){h+='<div class="row" onclick="openAcct(\''+s.id+'\')"><span class="rn">'+esc(s.name)+'</span><span class="rmeta">'+esc(s.note)+'</span></div>';});
 h+='</div>';
 return h;}
function accountsHTML(){var q=state.q.toLowerCase();var ids=DATA.order.filter(function(id){return DATA.accounts[id].name.toLowerCase().indexOf(q)>=0;});
 var h='<input class="search" id="sb" placeholder="Search your '+DATA.order.length+' accounts" value="'+esc(state.q)+'" oninput="state.q=this.value;repList();">';
 h+='<div class="alist" id="alist">'+listHTML(ids)+'</div>';return h;}
function listHTML(ids){return ids.slice(0,80).map(function(id){var a=DATA.accounts[id];var last=a.ctx[2][1];return '<div class="row" onclick="openAcct(\''+id+'\')"><span><span class="rn">'+esc(a.name)+'</span><div class="rmeta">'+esc(a.type)+' · last '+esc(last)+'</div></span></div>';}).join('');}
function repList(){var q=state.q.toLowerCase();var ids=DATA.order.filter(function(id){return DATA.accounts[id].name.toLowerCase().indexOf(q)>=0;});document.getElementById('alist').innerHTML=listHTML(ids);}
function cardHTML(){var a=DATA.accounts[state.id];if(!a)return '';
 var h='<div class="back" onclick="go(\''+(prevView||'accounts')+'\')">‹ Back</div>';
 h+='<div class="cardname">'+esc(a.name)+'</div><div class="cardtype">'+esc(a.type)+' · '+esc(DATA.rep)+'</div>';
 h+='<div class="block">'+a.ctx.map(function(r){return '<div class="crow"><span class="clab">'+esc(r[0])+'</span><span class="cval '+r[2]+'">'+esc(r[1])+'</span></div>';}).join('')+'</div>';
 if(a.alloc&&a.alloc.length){h+='<div class="block"><div class="bt w">▲ Allocation — going fast</div>'+a.alloc.map(function(it){return '<div class="li"><b>'+esc(it[0])+'</b><span class="q w">'+esc(it[1])+'</span></div>';}).join('')+'</div>';}
 if(a.stock&&a.stock.length){h+='<div class="block"><div class="bt g">● In stock from their producers</div>'+a.stock.map(function(it){return '<div class="li"><b>'+esc(it[0])+'</b><span class="q g">'+esc(it[1])+'</span></div>';}).join('')+'</div>';}
 h+='<div class="pitch"><div class="bt">✦ Suggested pitch</div><p id="pt">'+esc(a.pitch)+'</p><div class="act"><button class="copy" onclick="cp()">Copy</button><div class="fb"><button class="fbb'+(fb[state.id]==1?' on':'')+'" onclick="rate(1)">👍</button><button class="fbb'+(fb[state.id]==-1?' on':'')+'" onclick="rate(-1)">👎</button></div></div></div>';
 h+='<div class="note">Read-only preview · refreshed from the daily export</div>';
 return h;}
var prevView='today';
function cp(){var a=DATA.accounts[state.id];navigator.clipboard.writeText(a.pitch);var b=document.querySelector('.copy');b.textContent='Copied ✓';setTimeout(function(){b.textContent='Copy';},1500);}
function rate(v){fb[state.id]=v;render();}
function render(){setTabs();var m=document.getElementById('main');if(state.view==='today'){prevView='today';m.innerHTML=todayHTML();}else if(state.view==='accounts'){prevView='accounts';m.innerHTML=accountsHTML();}else{m.innerHTML=cardHTML();}window.scrollTo(0,0);}
render();
</script></body></html>
